<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS HUD | AI Voice Assistant</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="hud-container">
        <!-- Top Status Bar -->
        <header class="hud-header">
            <div class="hud-brand">
                <span class="pulse-dot"></span>
                <div>
                    <h1>{{ assistant_name }} <span class="version">v2.0</span></h1>
                    <span class="developer-credit">Dev: <strong>{{ author }}</strong></span>
                </div>
            </div>
            <div class="system-stats">
                <div class="stat-card">
                    <span class="stat-label">CPU LOAD</span>
                    <span class="stat-val" id="cpu-stat">0%</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">RAM</span>
                    <span class="stat-val" id="ram-stat">0%</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">BATTERY</span>
                    <span class="stat-val" id="battery-stat">--</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">TIME</span>
                    <span class="stat-val" id="time-clock">--:--</span>
                </div>
            </div>
        </header>

        <!-- Main Visualizer Area -->
        <main class="hud-main">
            <!-- Central Arc Reactor / Visualizer -->
            <div class="reactor-wrapper" id="reactor-wrapper" title="Click Arc Reactor to Speak">
                <div class="reactor-ring outer-ring"></div>
                <div class="reactor-ring middle-ring"></div>
                <div class="reactor-ring inner-ring"></div>
                <div class="reactor-core" id="reactor-core">
                    <div class="core-glow"></div>
                    <div class="core-icon">
                        <svg viewBox="0 0 24 24" width="44" height="44" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                            <polyline points="2 17 12 22 22 17"></polyline>
                            <polyline points="2 12 12 17 22 12"></polyline>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Visualizer Sound Wave Bars -->
            <div class="wave-container" id="wave-container">
                <span class="bar"></span><span class="bar"></span><span class="bar"></span>
                <span class="bar"></span><span class="bar"></span><span class="bar"></span>
                <span class="bar"></span><span class="bar"></span><span class="bar"></span>
                <span class="bar"></span><span class="bar"></span><span class="bar"></span>
                <span class="bar"></span><span class="bar"></span><span class="bar"></span>
            </div>

            <div class="assistant-status" id="assistant-status">SYSTEM READY // AWAITING COMMAND</div>

            <!-- Quick Action Tags -->
            <div class="quick-actions">
                <button class="action-tag" data-cmd="Who created you?">👤 Developer</button>
                <!-- <button class="action-tag" data-cmd="What is your name?">🤖 Name</button> -->
                <button class="action-tag" data-cmd="What time is it?">⏰ Time</button>
                <button class="action-tag" data-cmd="System diagnostics">📊 System Info</button>
                <!-- <button class="action-tag" data-cmd="Open YouTube">▶️ YouTube</button> -->
                <button class="action-tag" data-cmd="Weather in Surat">⛅ Weather</button>
            </div>
        </main>

        <!-- Bottom Log & Input Console -->
        <footer class="hud-console">
            <!-- Terminal Log Feed -->
            <div class="console-logs" id="console-logs">
                <div class="log-entry system">
                    <span class="timestamp">[INIT]</span> JARVIS System Online. Welcome back, {{ user_name }}. (Created & Developed by {{ author }})
                </div>
            </div>

            <!-- Input Controls -->
            <div class="input-bar">
                <button class="mic-btn" id="mic-btn" title="Click to Speak">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                    <span class="mic-text">VOICE</span>
                </button>

                <input type="text" id="query-input" placeholder="Type a command or click VOICE / Arc Reactor to speak..." autocomplete="off" />

                <button class="send-btn" id="send-btn">
                    <span>EXECUTE</span>
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </footer>
    </div>

    <script src="/app.js"></script>
</body>
</html>
